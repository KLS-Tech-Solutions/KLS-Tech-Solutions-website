<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      Per-route metadata (title, description, canonical, Open Graph, Twitter)
      is injected at runtime by src/components/seo/Seo.tsx via react-helmet-async.
      The tags below are only the crawl-time fallback for the initial HTML —
      do not add page-specific values here, or routes will fight over them.
    -->
    <title>
      KLS Tech Solutions | IoT Engineering, Enterprise SaaS, AI Solutions &amp; KLS Academy
    </title>
    <meta
      name="description"
      content="KLS Tech Solutions builds IoT products, enterprise SaaS platforms and AI solutions in Bengaluru — plus verified remote internships through KLS Academy."
    />
    <meta name="author" content="KLS Tech Solutions" />

    <!-- Light mode only. color-scheme stops the browser auto-darkening form
         controls and scrollbars for users whose OS is set to dark. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FFFFFF" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Speeds up the analytics request by opening the connection early. -->
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />

    <!--
      Google Analytics 4 (gtag.js) — property G-9BLPF7SCZK

      This is Google's standard snippet with one addition: gtag('config') is
      skipped on localhost, so `npm run dev` sessions do not send events into
      the production property. The script still loads and window.gtag is still
      defined, so nothing in the app has to branch on it.

      This site is a single-page app, so gtag only reports the FIRST page a
      visitor lands on. Every route change after that is tracked from
      src/components/layout/RouteAnalytics.tsx — without it, GA would show one
      pageview per session and nothing else.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9BLPF7SCZK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      // Local and private-network hosts are excluded. The private ranges
      // matter because `npm run dev` binds to all interfaces, so testing on a
      // phone over Wi-Fi hits a 192.168.x address and would otherwise be
      // recorded as real traffic.
      window.__KLS_ANALYTICS_ENABLED__ =
        !/^(localhost|127\.0\.0\.1|\[::1\]|.*\.local|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+)$/.test(
          location.hostname,
        );

      if (window.__KLS_ANALYTICS_ENABLED__) {
        gtag("config", "G-9BLPF7SCZK");
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">
        This website requires JavaScript to run. Please enable JavaScript in your browser, or
        contact KLS Tech Solutions directly at klstechsolutions2025@gmail.com.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
