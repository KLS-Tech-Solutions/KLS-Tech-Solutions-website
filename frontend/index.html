<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      Per-route metadata (title, description, canonical, Open Graph, Twitter)
      is injected at runtime by src/components/seo/Seo.tsx via react-helmet-async.
      The tags below are only the crawl-time fallback for the initial HTML —
      do not add page-specific values here, or routes will fight over them.
    -->
    <title>KLS Tech Solutions | IoT Product Engineering, AI &amp; Secure Systems</title>
    <meta
      name="description"
      content="KLS Tech Solutions engineers intelligent IoT systems in Bengaluru — custom hardware and firmware, AI-driven automation, and security built in from day one."
    />
    <meta name="author" content="KLS Tech Solutions" />

    <!-- Light mode only. color-scheme stops the browser auto-darkening form
         controls and scrollbars for users whose OS is set to dark. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FFFFFF" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">
        This website requires JavaScript to run. Please enable JavaScript in your browser, or
        contact KLS Tech Solutions directly at klstechsolutions2025@gmail.com.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
